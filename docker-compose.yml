# =============================================================================
#  ИС «ГрузПоток» — развёртывание промышленного контура
#
#  Состав: PostgreSQL с расширением PostGIS, приложение под gunicorn,
#  обратный прокси nginx и служба регламентного обслуживания.
#
#  Запуск:  docker compose up -d
#  Логи:    docker compose logs -f app
#  Остановка с сохранением данных: docker compose down
# =============================================================================

services:

  db:
    image: postgis/postgis:16-3.4
    container_name: freightflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FF_DB_NAME:-freightflow}
      POSTGRES_USER: ${FF_DB_USER:-freightflow}
      POSTGRES_PASSWORD: ${FF_DB_PASSWORD:?укажите FF_DB_PASSWORD в файле .env}
      # Порядок сортировки кириллицы задаётся провайдером ICU: системной
      # локали ru_RU.UTF-8 в образе нет — доступны только C, C.UTF-8,
      # en_US.utf8 и POSIX, и initdb с ней создать кластер отказывается.
      # ICU даёт нужный порядок («Апельсин, ёж, Ёлка, Яблоко») без
      # генерации системной локали.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ru-RU --locale=C.UTF-8"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Сценарии из этого каталога выполняются при первом создании базы.
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/003_views.sql:/docker-entrypoint-initdb.d/20-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FF_DB_USER:-freightflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  app:
    build: .
    container_name: freightflow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FF_SECRET_KEY: ${FF_SECRET_KEY:?укажите FF_SECRET_KEY в файле .env}
      FF_DEBUG: "False"
      FF_ALLOWED_HOSTS: ${FF_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FF_CSRF_TRUSTED_ORIGINS: ${FF_CSRF_TRUSTED_ORIGINS:-}
      FF_DB_ENGINE: postgres
      FF_DB_NAME: ${FF_DB_NAME:-freightflow}
      FF_DB_USER: ${FF_DB_USER:-freightflow}
      FF_DB_PASSWORD: ${FF_DB_PASSWORD}
      FF_DB_HOST: db
      FF_DB_PORT: "5432"
      FF_REDIS_URL: redis://cache:6379/1
      # Загрузка данных передаётся исполнителю: выгрузка внешней службы идёт
      # минутами, и запрос пользователя столько ждать не должен.
      FF_CELERY_BROKER_URL: redis://cache:6379/2
      FF_LOG_LEVEL: ${FF_LOG_LEVEL:-INFO}
      FF_SSL_REDIRECT: ${FF_SSL_REDIRECT:-True}
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    # Первый запуск: применение миграций и настройка ролей выполняются до
    # старта веб-сервера, иначе часть запросов пришлась бы на неготовую базу.
    command: >
      sh -c "python backend/manage.py migrate --noinput &&
             python backend/manage.py setup_roles &&
             gunicorn config.wsgi:application
                 --chdir backend
                 --bind 0.0.0.0:8000
                 --workers 3 --threads 2 --timeout 60
                 --access-logfile - --error-logfile -"
    networks: [backend, frontend]

  cache:
    image: redis:7-alpine
    container_name: freightflow-cache
    restart: unless-stopped
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cache_data:/data
    networks: [backend]

  # Маршрутизатор на графе дорог OpenStreetMap: изохроны доступности и
  # маршруты с учётом габаритов и массы транспортного средства. Тайлы графа
  # собираются при первом запуске из выгрузки в data/routing/custom_files.
  # Служба доступна только изнутри контура: наружу её порт не выводится.
  router:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: freightflow-router
    restart: unless-stopped
    environment:
      serve_tiles: "True"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      force_rebuild: "False"
      server_threads: "${FF_ROUTER_THREADS:-2}"
    volumes:
      - ./data/routing/custom_files:/custom_files
    networks: [backend]

  proxy:
    image: nginx:1.27-alpine
    container_name: freightflow-proxy
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${FF_HTTP_PORT:-80}:80"
      - "${FF_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./deploy/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [frontend]

  # Исполнитель регламентных задач: загрузка данных из внешних источников.
  # Вынесена из веб-процесса, поскольку выгрузка Overpass идёт минутами.
  worker:
    build: .
    container_name: freightflow-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &worker_env
      FF_SECRET_KEY: ${FF_SECRET_KEY:?укажите FF_SECRET_KEY в файле .env}
      FF_DEBUG: "False"
      FF_DB_ENGINE: postgres
      FF_DB_NAME: ${FF_DB_NAME:-freightflow}
      FF_DB_USER: ${FF_DB_USER:-freightflow}
      FF_DB_PASSWORD: ${FF_DB_PASSWORD}
      FF_DB_HOST: db
      FF_DB_PORT: "5432"
      FF_REDIS_URL: redis://cache:6379/1
      FF_CELERY_BROKER_URL: redis://cache:6379/2
      FF_LOG_LEVEL: ${FF_LOG_LEVEL:-INFO}
    volumes:
      - osm_cache:/app/data/osm
      - logs_data:/app/logs
    # Одна задача за раз: одновременное обращение нескольких загрузок
    # к общедоступной службе Overpass приводит к отказу по превышению квоты.
    command: >
      sh -c "cd backend &&
             celery -A config worker
                 --loglevel=info --concurrency=1 --without-gossip --without-mingle"
    networks: [backend]

  # Планировщик: ведёт расписание регламентных загрузок.
  beat:
    build: .
    container_name: freightflow-beat
    restart: unless-stopped
    depends_on:
      - worker
    environment: *worker_env
    volumes:
      - logs_data:/app/logs
    command: >
      sh -c "cd backend &&
             celery -A config beat
                 --loglevel=info --schedule=/tmp/celerybeat-schedule"
    networks: [backend]

  # Регламентное обслуживание: очистка устаревших файлов отчётов.
  maintenance:
    build: .
    container_name: freightflow-maintenance
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FF_SECRET_KEY: ${FF_SECRET_KEY}
      FF_DB_ENGINE: postgres
      FF_DB_NAME: ${FF_DB_NAME:-freightflow}
      FF_DB_USER: ${FF_DB_USER:-freightflow}
      FF_DB_PASSWORD: ${FF_DB_PASSWORD}
      FF_DB_HOST: db
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    command: >
      sh -c "while true; do
               sleep 86400;
               python backend/manage.py cleanup_exports;
             done"
    networks: [backend]

volumes:
  db_data:
  media_data:
  static_data:
  logs_data:
  cache_data:
  # Ответы Overpass сохраняются между запусками: повторная загрузка не создаёт
  # нагрузки на общедоступную службу, а по сохранённому ответу видно, какие
  # именно данные легли в базу.
  osm_cache:

networks:
  # База данных и кеш недоступны извне: с ними работает только приложение.
  backend:
    internal: true
  frontend:
