{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="card" style="max-width:560px;margin:0 auto">
    <h2 style="margin-bottom:var(--sp-4)">{% trans 'Смена пароля' %}</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="field" style="margin-bottom:var(--sp-3)">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="field__error">{{ field.errors|join:" " }}</p>
                {% elif field.help_text %}
                    <p class="field__hint">{{ field.help_text|safe }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button class="button button--primary button--block" type="submit"
                style="margin-top:var(--sp-4)">{% trans 'Сменить пароль' %}</button>
    </form>
</div>
{% endblock %}
