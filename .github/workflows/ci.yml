# Непрерывная интеграция ИС «ГрузПоток».
#
# Набор проверок выполняется дважды: на SQLite (быстрый прогон, отражающий
# контур разработки) и на PostgreSQL с расширением PostGIS (промышленный
# контур). Двойной прогон обязателен: геометрический слой использует разные
# выражения SQL для каждой СУБД, и ошибка в одном из них не обнаруживается
# проверкой другого.

name: Проверки

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  style:
    name: Стиль кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка ruff
        run: pip install ruff==0.14.0
      - name: Проверка стиля
        run: ruff check backend tests
      - name: Проверка форматирования импортов
        run: ruff check --select I backend tests

  tests-sqlite:
    name: Автотесты (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: |
          pip install -e ".[dev]"
      - name: Прогон набора с измерением покрытия
        env:
          FF_SECRET_KEY: ci-only-secret-key-not-used-in-production-Bp7xQm2vTz9Kd4Lw
          FF_DEBUG: "False"
          FF_DB_ENGINE: sqlite
        run: pytest --cov=backend --cov-report=xml --cov-report=term
      - name: Публикация отчёта о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sqlite
          path: coverage.xml

  tests-postgres:
    name: Автотесты (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: freightflow
          POSTGRES_USER: freightflow
          POSTGRES_PASSWORD: freightflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -e ".[dev]"
      - name: Прогон набора на промышленном контуре
        env:
          FF_SECRET_KEY: ci-only-secret-key-not-used-in-production-Bp7xQm2vTz9Kd4Lw
          FF_DEBUG: "False"
          FF_DB_ENGINE: postgres
          FF_DB_NAME: freightflow
          FF_DB_USER: freightflow
          FF_DB_PASSWORD: freightflow
          FF_DB_HOST: 127.0.0.1
          FF_DB_PORT: "5432"
        run: pytest -q

  # Проверки в управляемом браузере вынесены в отдельное задание: они требуют
  # загрузки браузера и идут дольше остальных, поэтому не должны задерживать
  # быструю обратную связь от модульного набора.
  #
  # Задание закрывает разрыв в методике, из-за которого отказ карты оставался
  # незамеченным: тестовый клиент Django получает разметку, но не исполняет
  # сценарии, а карта ломалась именно на стороне клиента.
  tests-browser:
    name: Проверки в браузере
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -e ".[dev]"
      - name: Установка браузера
        run: python -m playwright install --with-deps chromium
      - name: Прогон проверок в браузере
        env:
          FF_SECRET_KEY: ci-only-secret-key-not-used-in-production-Bp7xQm2vTz9Kd4Lw
          FF_DEBUG: "False"
          FF_DB_ENGINE: sqlite
        run: pytest tests/test_browser.py -q

  checks:
    name: Системные проверки Django
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Сборка статики предшествует проверке намеренно. Хранилище с манифестом
      # разрешает имена файлов по нему, поэтому отсутствие манифеста проявляется
      # не при сборке, а на каждой странице промышленного контура. Задание
      # исполняет эту ветвь на каждом изменении, где бы она ни оборвалась —
      # на недостающей ссылке внутри вендорного файла или на самой сборке.
      - name: Сборка статики промышленного контура
        env:
          FF_SECRET_KEY: ci-only-secret-key-not-used-in-production-Bp7xQm2vTz9Kd4Lw
          FF_DEBUG: "False"
          FF_ALLOWED_HOSTS: freightflow.example.ru
          FF_DB_ENGINE: sqlite
        run: python backend/manage.py collectstatic --noinput --clear

      - name: Проверка конфигурации промышленного контура
        env:
          FF_SECRET_KEY: ci-only-secret-key-not-used-in-production-Bp7xQm2vTz9Kd4Lw
          # Проверка --deploy оценивает настройки промышленного контура,
          # поэтому окружение задаётся соответствующим: при включённой отладке
          # Django обоснованно сообщает о незащищённых cookie и отсутствии HSTS.
          FF_DEBUG: "False"
          FF_ALLOWED_HOSTS: freightflow.example.ru
          FF_DB_ENGINE: sqlite
        run: python backend/manage.py check --deploy --fail-level WARNING
      - name: Проверка полноты миграций
        env:
          FF_SECRET_KEY: ci-only-secret-key-not-used-in-production-Bp7xQm2vTz9Kd4Lw
          FF_DEBUG: "False"
          FF_ALLOWED_HOSTS: freightflow.example.ru
          FF_DB_ENGINE: sqlite
        run: python backend/manage.py makemigrations --check --dry-run
