[project]
name = "freightflow"
version = "1.0.0"
description = "ИС «ГрузПоток» — информационная система по логистической инфраструктуре города Москвы"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Бухаров Родион Романович" }]

dependencies = [
    "django==6.0.7",
    "djangorestframework==3.17.1",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.4",
    "whitenoise==6.11.0",
    "gunicorn==23.0.0",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "reportlab==4.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "pytest-cov==7.0.0",
    "ruff==0.14.0",
    "locust==2.42.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["backend"]
omit = ["*/migrations/*", "*/tests/*", "*/venv/*"]

[tool.setuptools]
# Проект является приложением, а не библиотекой: устанавливать в site-packages
# нечего, установка через `pip install -e .` нужна только для получения
# зависимостей. Без явного указания setuptools пытается определить состав
# пакетов самостоятельно, обнаруживает несколько каталогов верхнего уровня
# (backend, db, data, deploy, logs, media) и отказывается собирать проект.
py-modules = []
