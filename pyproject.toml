[project]
name = "freightflow"
version = "1.0.0"
description = "ИС «ГрузПоток» — информационная система по логистической инфраструктуре города Москвы"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Бухаров Родион Романович" }]

# Состав зависимостей читается из requirements.txt, а не перечисляется здесь.
# Единственный источник версий нужен потому, что раньше список был продублирован
# в этом файле и в Dockerfile, и расходились они молча — образ мог собираться
# с версиями, на которых не прогонялись тесты.
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "browser: проверки в управляемом браузере (требуют playwright install chromium)",
]

[tool.coverage.run]
source = ["backend"]
omit = ["*/migrations/*", "*/tests/*", "*/venv/*"]

[tool.setuptools]
# Проект является приложением, а не библиотекой: устанавливать в site-packages
# нечего, установка через `pip install -e .` нужна только для получения
# зависимостей. Без явного указания setuptools пытается определить состав
# пакетов самостоятельно, обнаруживает несколько каталогов верхнего уровня
# (backend, db, data, deploy, logs, media) и отказывается собирать проект.
py-modules = []
