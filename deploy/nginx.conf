# =============================================================================
#  Обратный прокси ИС «ГрузПоток»
#
#  Задачи прокси: терминирование TLS, раздача статики и медиафайлов в обход
#  приложения, ограничение частоты обращений и передача исходного адреса
#  клиента приложению.
# =============================================================================

# Ограничение частоты: отдельные зоны для интерфейса и программного доступа.
limit_req_zone $binary_remote_addr zone=ff_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ff_api:10m rate=10r/s;

upstream freightflow_app {
    server app:8000;
    keepalive 32;
}

# Перенаправление на защищённое соединение.
server {
    listen 80;
    server_name _;

    # Каталог для подтверждения владения доменом при выпуске сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Предельный размер вложения в форме обратной связи — 10 МБ, плюс запас.
    client_max_body_size 25m;

    include /etc/nginx/security_headers.conf;

    # Сжатие текстовых ответов. Изображения и шрифты уже сжаты.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/geo+json image/svg+xml;

    # --- Статические файлы ---------------------------------------------------
    # Имена файлов содержат хеш содержимого (WhiteNoise), поэтому срок
    # хранения в кеше браузера может быть установлен максимальным.
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Медиафайлы ----------------------------------------------------------
    # Сформированные отчёты раздаются только через приложение, проверяющее
    # принадлежность файла, поэтому каталог exports здесь закрыт.
    location /media/exports/ {
        return 403;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "public";
    }

    # --- Программный интерфейс ------------------------------------------------
    location /api/ {
        limit_req zone=ff_api burst=20 nodelay;
        proxy_pass http://freightflow_app;
        include /etc/nginx/proxy_params.conf;
    }

    # --- Проверка доступности --------------------------------------------------
    location = /healthz {
        proxy_pass http://freightflow_app;
        include /etc/nginx/proxy_params.conf;
        access_log off;
    }

    # --- Приложение ------------------------------------------------------------
    location / {
        limit_req zone=ff_web burst=50 nodelay;
        proxy_pass http://freightflow_app;
        include /etc/nginx/proxy_params.conf;
    }
}
