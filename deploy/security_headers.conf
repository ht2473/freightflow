# Заголовки безопасности ответа.
#
# Файл включается и в блоке server, и в каждом location, который объявляет
# собственные заголовки: nginx не складывает директивы add_header разных
# уровней, а берёт ближайший набор целиком. Без повторного включения статика
# — сценарии, стили и шрифты — отдавалась бы без указания не угадывать
# тип содержимого.
#
# Политика безопасности содержимого здесь не задаётся: её ставит само
# приложение, поэтому она действует и тогда, когда статику раздаёт
# контейнер без обратного прокси.

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
